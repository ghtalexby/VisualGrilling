<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Грилинг-карта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with status ledger, dotted pannable canvas holding a left-to-right question tree, side drawer for answering. */
:root{
  --bg:#E9EDF1; --surface:#FFFFFF; --ink:#141C28; --muted:#5A6576; --line:#C6CED8; --dot:#C3CBD6;
  --accent:#2440C2; --accent-ink:#FFFFFF;
  --ok:#1D7A4C; --weak:#A86300; --gap:#C02D27; --verify:#6939C0; --open:#5A6576;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E131A; --surface:#17202B; --ink:#E5EAF1; --muted:#95A1B3; --line:#2B3646; --dot:#253041;
  --accent:#8199FF; --accent-ink:#0E131A;
  --ok:#4BC389; --weak:#EFA83A; --gap:#FF6B5F; --verify:#B293FF; --open:#95A1B3; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
.error-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;width:max-content;max-width:calc(100vw - 32px);max-height:50vh;overflow:auto;display:flex;align-items:flex-start;gap:16px;padding:16px;background:var(--surface);color:var(--gap);border:1px solid var(--gap);border-radius:8px;box-shadow:0 8px 32px #0003}
.error-toast[hidden]{display:none}
.error-toast span{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.error-toast .btn{position:relative;flex:none;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:transparent;color:inherit}
.error-toast .btn svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.error-toast .btn circle{fill:none;stroke:currentColor;stroke-width:2;stroke-dasharray:100;stroke-dashoffset:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.s-open{--sc:var(--open)} .s-ok{--sc:var(--ok)} .s-weak{--sc:var(--weak)} .s-gap{--sc:var(--gap)} .s-verify{--sc:var(--verify)} .s-think{--sc:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--sc);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.pill.s-open::before,.s-open>.nhead .pill::before{background:transparent;border:1.5px solid var(--sc);width:5px;height:5px}
.pill.s-think::before{animation:pulse 1s infinite alternate}

header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px;z-index:5}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand-activity{position:relative;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none}
.brand-activity.pending{color:var(--accent)}
.brand-activity.pending::before{content:"";position:absolute;inset:-2px;border:2px solid var(--accent);border-right-color:transparent;border-bottom-color:transparent;border-radius:50%}
.brand-activity.active::before{animation:reread-spin 1.4s linear infinite}
@media(prefers-reduced-motion:reduce){.brand-activity.active::before{animation:none}}
.ptitle{color:var(--muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 120px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:14px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.reread-busy{display:inline-flex;align-items:center;gap:8px;opacity:.8}
.btn.reread-busy::before{content:"";width:12px;height:12px;flex:none;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:reread-spin .8s linear infinite}
@keyframes reread-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.btn.reread-busy::before{animation:none}}
.btn.small{padding:4px 9px;font-size:13px}
.lrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.ledger{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.ledger .pill b{color:var(--ink);font-weight:500;margin-left:2px}
.ledger button.pill{background:none;border:1px solid transparent;border-radius:4px;padding:2px 6px;margin:-3px -6px;cursor:pointer}
.ledger button.pill:hover:not(:disabled){border-color:color-mix(in srgb,var(--sc) 45%,var(--line))}
.ledger button.pill[aria-pressed="true"]{background:color-mix(in srgb,var(--sc) 16%,transparent);border-color:var(--sc)}
.ledger button.pill:disabled{opacity:.45;cursor:default}
.agent-controls{display:flex;align-items:center;gap:6px;margin-left:auto}
.agent-control{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;padding:0;flex:none}
.conn{font-family:var(--f-mono);font-size:11.5px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.conn.off i{background:transparent;border:1.5px solid var(--weak)}
.conn.dead i{background:var(--gap)}
.conn b{font-weight:500;color:var(--ink)}

main{flex:1;position:relative;min-height:0;z-index:0}
#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
#viewport.panning{cursor:grabbing;user-select:none}
#viewport.panning .node{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke-width:1.6;pointer-events:stroke}
.node{position:absolute;width:252px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px 11px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,box-shadow .15s}
.node.q{border-color:color-mix(in srgb,var(--sc) 45%,var(--line))}
.node.q.s-open{border-style:dashed;border-color:var(--line)}
.node.q.s-think{border-style:solid;border-color:var(--accent)}
.node:hover{border-color:var(--sc,var(--ink));box-shadow:0 2px 10px color-mix(in srgb,var(--ink) 10%,transparent)}
.node.sel{box-shadow:0 0 0 2px var(--accent)}
.node.fresh{animation:fresh 1.8s ease-out}
.node.ctx{opacity:.5}
@keyframes fresh{0%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
.nhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.area{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area b{color:var(--ink);font-weight:500}
.qtext{font-size:14px;font-weight:500;line-height:1.35}
.ans{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ans::before{content:"↳ ";color:var(--sc)}
.node.root{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:14px 14px 13px}
.node.root .eyebrow{color:color-mix(in srgb,var(--bg) 65%,var(--ink))}
.rtitle{font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.25;text-wrap:balance}
.rmeta{font-family:var(--f-mono);font-size:11px;color:color-mix(in srgb,var(--bg) 65%,var(--ink))}
.ridea{font-size:12px;line-height:1.35;color:color-mix(in srgb,var(--bg) 85%,var(--ink));display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.busy-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate;flex:none}

.hint{position:absolute;left:16px;bottom:16px;right:16px;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center;z-index:2}
.hint b{color:var(--ink)}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden;z-index:2}
.zoom button{border:0;background:none;width:34px;height:32px;cursor:pointer;font-family:var(--f-mono)}
.zoom button+button{border-left:1px solid var(--line)}
.zoom button:hover{background:var(--bg)}

/* --panel-w is the remembered width; the cap keeps part of the map reachable when the window is narrower than that width */
:root{--panel-w:440px;--panel-cur:min(var(--panel-w),100vw - 120px)}
@media (max-width:560px){:root{--panel-cur:100vw}#panelGrip{display:none}}
#panel{position:absolute;top:0;right:0;bottom:0;width:var(--panel-cur);background:var(--surface);border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;box-shadow:-8px 0 30px color-mix(in srgb,var(--ink) 12%,transparent)}
#panelGrip{position:absolute;top:0;bottom:0;right:calc(var(--panel-cur) - 4px);width:8px;z-index:21;cursor:col-resize;touch-action:none;user-select:none}
#panelGrip::before{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:var(--accent);opacity:0;transition:opacity .12s}
#panelGrip:hover::before,#panelGrip.drag::before,#panelGrip:focus-visible::before{opacity:1}
#panelGrip:focus-visible{outline-offset:-2px}
#panel[hidden]~#panelGrip{display:none}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.ph .close{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px;margin-right:-6px}
.ph .close:hover{color:var(--ink)}
.pb{flex:1;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.pb h2{font-weight:600;font-size:18px;line-height:1.3;margin:0;text-wrap:balance}
.pb h2+.why{margin-top:-8px}
.pb h3,label.fl{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.pb h3{margin:6px 0 0}
.why{margin:0;color:var(--muted);font-size:14px}
.crumbs{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:14px;line-height:1.35;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--ink)}
.chip.idk{border-style:dashed;color:var(--muted)}
.chip.idk:hover{color:var(--ink)}
.chip.recommended{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.isolation{position:absolute;top:16px;left:16px;z-index:3;display:flex;align-items:center;gap:6px}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:10px 12px;font:400 14px/1.45 var(--f-body);letter-spacing:normal;text-transform:none;resize:vertical}
textarea::placeholder{color:var(--muted);opacity:.8}
textarea:focus{outline:none;border-color:var(--accent)}
#fMsg,#fAns,#fQuestion{resize:none;overflow-y:auto;max-height:40vh}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumb{position:relative;display:block}
.thumb img{display:block;height:64px;max-width:120px;object-fit:cover;border:1px solid var(--line);border-radius:6px}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:0;border-radius:50%;background:var(--surface);color:var(--ink);cursor:pointer;font-size:14px;line-height:1;padding:0}
.chatimg{display:block;height:160px;width:auto;max-width:100%;object-fit:contain;margin-top:6px;border-radius:4px;cursor:zoom-in}
label.fl{display:flex;flex-direction:column;gap:6px}
.fl+.row{margin-top:-4px}
.keys{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.verdict{border:1px solid color-mix(in srgb,var(--sc) 40%,var(--line));background:color-mix(in srgb,var(--sc) 7%,var(--surface));border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.verdict p{margin:0;font-size:14px}
.verdict[data-verdict]{cursor:context-menu}
.verdict .atext{color:var(--muted);white-space:pre-wrap}
.sublist{display:flex;flex-direction:column;gap:6px}
.subq{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;font-size:14px}
.subq:hover{border-color:var(--ink)}
.subq .pill,.subq .mono{flex:none;margin-top:2px}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:6px;padding:10px 12px}
.note code{font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.err{font-size:13px;color:var(--gap);border:1px solid color-mix(in srgb,var(--gap) 40%,var(--line));border-radius:6px;padding:10px 12px}
.warn{font-size:13px;border:1px solid color-mix(in srgb,var(--weak) 45%,var(--line));background:color-mix(in srgb,var(--weak) 8%,var(--surface));border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:2px}
.tab{border:0;border-bottom:2px solid transparent;background:none;margin-bottom:-1px;padding:8px 0;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:92%;border-radius:6px;padding:9px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:color-mix(in srgb,var(--accent) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.msg.claude{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.quote{display:block;border-left:2px solid var(--accent);padding-left:8px;margin-bottom:4px;color:var(--muted);font-size:13px}
.qbox{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:13px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.qbox button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 4px}
#ctxmenu{position:fixed;z-index:40;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 18%,transparent)}
#ctxmenu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:4px;padding:7px 10px;font-size:14px;cursor:pointer}
#ctxmenu button:hover,#ctxmenu button:focus-visible{background:var(--bg);outline:none}
.msg .who{display:block;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.working{display:flex;align-items:center;gap:10px;font-size:14px}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--bg)}
.bar span{background:var(--sc)}
.bar span.s-open{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)}
.stats{display:flex;flex-wrap:wrap;gap:6px;font-variant-numeric:tabular-nums}
.stats div{flex:1 0 auto;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--f-display);font-weight:500;font-size:20px}
.mono{font-family:var(--f-mono);font-size:12px}
.final{border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:14px;white-space:pre-wrap;background:var(--bg)}
#md{font-family:var(--f-mono);font-size:12px;min-height:140px}
[hidden]{display:none!important}
@media (max-width:520px){.brand span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.map-picker{position:relative}
.map-list{position:absolute;top:100%;left:0;width:min(440px,85vw);max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px #0003;padding:8px;z-index:10}
.map-row{display:block;padding:10px;color:var(--ink);text-decoration:none;border-radius:6px;overflow-wrap:anywhere}
.map-row[aria-current="page"]{outline:1px solid var(--muted)}
.map-row small{display:block;color:var(--muted);margin-top:4px}
.map-row a{color:inherit}
#finishedNotice{font-size:12px;color:var(--muted)}
.node.idea{border-style:double;border-width:3px}.node.idea .qtext{white-space:pre-wrap;max-height:160px;overflow:hidden}
.root-main{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:inherit;cursor:pointer;overflow-wrap:anywhere}
.root-stats{display:flex;flex-direction:column;gap:4px;margin-top:4px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--bg) 18%,transparent);line-height:1.4}
.node.unread{box-shadow:0 0 0 3px var(--accent)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.zoom button{width:auto;min-width:32px;padding:0 9px}
.msg [data-copy]{display:block;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><span class="brand-activity" id="brandActivity" role="img" aria-label="Грилинг-карта"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="9" r="3" fill="currentColor"/><circle cx="14" cy="3.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14" cy="14.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 9h4.8M6.5 7.5 11.8 4M6.5 10.5l5.3 3.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg></span><span>Грилинг-карта</span></div>
    <div class="map-picker" id="mapPicker"><button class="btn" id="bMaps" aria-expanded="false" aria-controls="mapList">Карты</button><div class="map-list" id="mapList" hidden></div></div>
    <div class="ptitle" id="ptitle"></div>
    <div class="actions"><button class="btn" id="bReread" title="Агент заново прочитает всю карту и перестроит схему. Ваши ответы сохранятся">Перечитать</button><button class="btn" id="bSpec" title="Создать план в docs/specs. Обновление заменяет ручные правки">Создать спеку</button><button class="btn" id="bChat">Общий чат</button><button class="btn" id="bSummary">Сводка и итог</button></div>
  </div>
  <div class="lrow"><div class="ledger" id="ledger"></div><div class="agent-controls"><div class="conn" id="conn"></div><button class="btn agent-control" id="bPlay" aria-label="Продолжить грилинг" title="Продолжить грилинг в текущей сессии агента"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l9 6-9 6z" fill="currentColor"/></svg></button><button class="btn agent-control" id="bStop" aria-label="Остановить" title="Завершить грилинг: агент подготовит итог и перестанет слушать карту"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1" fill="currentColor"/></svg></button></div></div>
  <div id="resumeNotice" class="why" role="status" hidden></div>
  <div id="finishedNotice" hidden></div>
</header>

function friendlyError(message){
  const text=typeof message==="string"?message.trim():"";
  const messages=S.locale?.messages||{};
  const known=ERROR_MESSAGES.find(([source])=>source===text||messages[source]===text);
  if(known)return messages[known[1]]||known[1];
  if(/^(?:TypeError: )?(Failed to fetch|fetch failed|Load failed|NetworkError.*)$/i.test(text))return "Не удалось связаться с сервером карты. Проверьте, что он запущен, и повторите действие.";
  if(/^(?:Error: )?(?:ENOENT|EACCES|EPERM|ENOSPC|EROFS|EIO|EBUSY|ENOTDIR|EISDIR)\b/.test(text))return "Сервер не смог открыть или сохранить файл. Попросите агента проверить наличие файла, права доступа и свободное место на диске.";
  return text||"Не удалось выполнить действие на сервере. Повторите попытку; если ошибка повторится, попросите агента проверить журнал сервера.";
}

let errorTimer=null,errorCountdown=null;

}
function showError(message){

}

async function api(p,body){
  let r,t;
  try{
    r=await fetch(p,{method:body?"POST":"GET",headers:{"content-type":"application/json","x-grill":"1"},body:body?JSON.stringify(body):undefined});
    t=await r.text();
  }catch{throw new Error("Не удалось связаться с сервером карты. Проверьте, что он запущен, и повторите действие.")}
  let j;try{j=JSON.parse(t)}catch{j=null}
  if(!r.ok){
    const message=typeof j?.error==="string"?j.error.trim():"",readable=friendlyError(message);
    if(r.status===404&&/^not found$/i.test(message||t.trim()))throw new Error(p==="/api/reread"?"Не удалось перечитать карту. Сервер не поддерживает эту команду. Перезапустите сервер карты и обновите страницу.":"Сервер не нашёл команду. Перезапустите сервер карты и обновите страницу.");
    if(message&&readable!==message)throw new Error(readable);
    if(r.status===413)throw new Error("Запрос слишком большой. Сократите текст или уменьшите число и размер изображений.");
    if(r.status>=500)throw new Error("Не удалось выполнить действие на сервере. Повторите попытку; если ошибка повторится, попросите агента проверить журнал сервера.");
    if(message&&!/^(?:SyntaxError|TypeError|Error):|Unexpected (?:token|end)|^\s*[<{]/i.test(message))throw new Error(message);
    throw new Error("Сервер отклонил запрос. Обновите страницу карты и повторите действие.");
  }
  if(!j||typeof j!=="object"||Array.isArray(j))throw new Error("Сервер прислал непонятный ответ. Обновите страницу; если ошибка повторится, перезапустите сервер карты.");
  return j;
}
/* <img> cannot send x-grill: fetch the protected file once and reuse its blob URL across panel re-renders */
function imgUrl(f){
  if(imgUrls[f])return imgUrls[f];
  const job=fetch("/api/image?file="+encodeURIComponent(f),{headers:{"x-grill":"1"}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.blob()}).then(b=>imgUrls[f]===job?URL.createObjectURL(b):null).catch(e=>{if(imgUrls[f]===job)delete imgUrls[f];throw e});
  return imgUrls[f]=job;
}
function pruneImgUrls(){
  const used=new Set(S.nodes.flatMap(n=>(n.chat||[]).flatMap(m=>m.images||[])));
  for(const [f,job] of Object.entries(imgUrls))if(!used.has(f)){delete imgUrls[f];job.then(u=>{if(u)URL.revokeObjectURL(u)},()=>{})}
}
const showImages=p=>p.querySelectorAll("img[data-img]").forEach(i=>imgUrl(i.dataset.img).then(u=>{if(u&&i.isConnected)i.src=u},()=>{}));

  }

}
async function previewAction(action){
  clearError();
  try{
    if(action==="prepare"){
      const result=await api("/api/preview/prepare",{sourceId:panel.id,id:$("#previewTarget").value||undefined,branches:[...document.querySelectorAll("[data-preview-branch]:checked")].map(e=>e.dataset.previewBranch)});
      await poll(true);openPanel({mode:"node",id:result.id});
    }else if(action==="open")await openPreview(panel.id);
    else if(action==="build"){
      if(previewView?.id===panel.id&&!await guardPreview())return;
      await api("/api/preview/build",{id:panel.id,request:$("#fPreview").value});await poll(true);
    }else if(action==="delete"){
      if(!confirm("Удалить проект превью и историю?"))return;
      if(previewView?.id===panel.id){if(!await guardPreview())return;closePreviewNow()}
      await api("/api/preview/delete",{id:panel.id,confirm:true});await poll(true);
    }else{await api("/api/preview/policy",{id:panel.id,policy:action==="keep"?"keep":"delete"});await poll(true)}
  }catch(e){showError(e.message);renderPanel()}
}
$("#panel").addEventListener("input",e=>{if(e.target.id==="fPreview")drafts["p:"+panel.id]=e.target.value});
$("#panel").addEventListener("change",e=>{if(e.target.id==="previewTarget")panel.previewTarget=e.target.value;if(e.target.matches("[data-preview-branch]"))panel.branches=[...document.querySelectorAll("[data-preview-branch]:checked")].map(e=>e.dataset.previewBranch)});
$("#panel").addEventListener("click",e=>{const option=e.target.closest("[data-preview-option]");if(option){$("#fPreview").value=option.dataset.previewOption;drafts["p:"+panel.id]=option.dataset.previewOption}const b=e.target.closest("[data-preview]");if(b)previewAction(b.dataset.preview)});
function closePreviewNow(){previewOpenSequence++;for(const request of previewRequests.values())request.reject(new Error("Превью закрыто"));previewRequests.clear();previewView?.el.remove();previewView=null}
function frameRequest(type){
  const v=previewView;if(!v?.ready)return Promise.reject(new Error("Превью ещё не готово"));
  return new Promise((resolve,reject)=>{const requestId=crypto.randomUUID(),timer=setTimeout(()=>{previewRequests.delete(requestId);reject(new Error("Превью не ответило"))},5000);
    previewRequests.set(requestId,{type,resolve:value=>{clearTimeout(timer);resolve(value)},reject:error=>{clearTimeout(timer);reject(error)}});
    v.frame.contentWindow.postMessage({type,instance:v.instance,requestId},"*");
  });
}
async function savePreview(){
  clearError();
  const v=previewView;if(v.snapshot)throw new Error("Снимок доступен только для просмотра");
  const generation=v.dirtyRevision,data=await frameRequest("save");
  if(v!==previewView)throw new Error("Превью закрыто");

function render(){

  if(isolated){chain(get(isolated.id));hit.add(isolated.id)}

    const t=c.reduce((s,k)=>s+sub[k.id],0)+VG*Math.max(0,c.length-1);let y=top+(sub[id]-t)/2;c.forEach(k=>{place(k.id,y,d+1);y+=sub[k.id]+VG})};

function applyView(){
  $("#stage").style.transform=`translate(${px}px,${py}px) scale(${zoom})`;
  const v=$("#viewport");v.style.backgroundPosition=`${px}px ${py}px`;v.style.backgroundSize=`${22*zoom}px ${22*zoom}px`;
}
/* glide the map so its content sits in the middle of the visible canvas (left of an open panel); the root sits at the stage's vertical middle, so it stays in view; a too-wide map is pinned left, where the root is */
let glide=0;
const stopGlide=()=>{cancelAnimationFrame(glide);glide=0};
function glideTo(tx,ty){
  stopGlide();
  if(matchMedia("(prefers-reduced-motion:reduce)").matches){px=tx;py=ty;applyView();return}
  const x0=px,y0=py,t0=performance.now(),D=380;
  const step=t=>{const k=Math.max(0,Math.min(1,(t-t0)/D)),e=1-Math.pow(1-k,3);px=x0+(tx-x0)*e;py=y0+(ty-y0)*e;applyView();glide=k<1?requestAnimationFrame(step):0};
  glide=requestAnimationFrame(step);
}
function viewWidth(){const p=$("#panel");return Math.max(1,vp.clientWidth-(p.hidden?0:p.offsetWidth))}
function centerNode(id){
  const b=$(`#stage .node[data-id="${CSS.escape(id)}"]`);if(!b)return;
  glideTo(viewWidth()/2-(b.offsetLeft+b.offsetWidth/2)*zoom,vp.clientHeight/2-(b.offsetTop+b.offsetHeight/2)*zoom);
}
function focusFilter(){
  if(!flt){centerMap();return}
  const matches=[...document.querySelectorAll("#stage .node.q")].filter(b=>{const n=get(b.dataset.id);return n&&["q","idea"].includes(n.kind)&&!n.obsolete&&n.status===flt}).sort((a,b)=>a.offsetLeft-b.offsetLeft||a.offsetTop-b.offsetTop);
  if(matches.length)centerNode(matches[0].dataset.id);else centerMap();
}
function centerMap(){
  const st=$("#stage"),vw=viewWidth(),w=st.offsetWidth*zoom,h=st.offsetHeight*zoom;
  glideTo(w<vw?(vw-w)/2:0,(vp.clientHeight-h)/2);
}
/* zoom keeps the map point under (ax,ay) — viewport-relative, default centre — in place */
function setZoom(z,ax,ay){
  stopGlide();
  z=zoom<.1?.1:Math.min(2,Math.max(.1,z));if(z===zoom)return;
  if(ax==null){ax=vp.clientWidth/2;ay=vp.clientHeight/2}
  px=ax-(ax-px)*z/zoom;py=ay-(ay-py)*z/zoom;zoom=z;applyView();
}
const stepZoom=d=>setZoom(Math.round((zoom+d)*10)/10);
$("#zIn").onclick=()=>stepZoom(.1);$("#zOut").onclick=()=>stepZoom(-.1);$("#zAll").onclick=()=>fitMap();
function fitMap(){
  stopGlide();
  const nodes=[...document.querySelectorAll("#stage .node")];
  if(!nodes.length)return;
  const left=Math.min(...nodes.map(n=>n.offsetLeft)),top=Math.min(...nodes.map(n=>n.offsetTop));
  const right=Math.max(...nodes.map(n=>n.offsetLeft+n.offsetWidth)),bottom=Math.max(...nodes.map(n=>n.offsetTop+n.offsetHeight));
  const w=viewWidth(),h=vp.clientHeight;
  zoom=Math.min(2,Math.max(1,w-48)/(right-left),Math.max(1,h-48)/(bottom-top));
  px=(w-(right-left)*zoom)/2-left*zoom;py=(h-(bottom-top)*zoom)/2-top*zoom;applyView();
}
/* wheel zooms toward the cursor; mostly-horizontal trackpad swipes pan */
vp.addEventListener("wheel",e=>{
  e.preventDefault();stopGlide();
  const k=e.deltaMode===1?16:e.deltaMode===2?400:1;
  if(!e.ctrlKey&&Math.abs(e.deltaX)>Math.abs(e.deltaY)){px-=e.deltaX*k;applyView();return}
  const r=vp.getBoundingClientRect();
  setZoom(zoom*Math.exp(-e.deltaY*k*.0015),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
/* drag pans the map: middle button anywhere, left button on empty canvas; preventDefault also suppresses the browser's autoscroll */
let pan=null;
vp.addEventListener("mousedown",e=>{if(!(e.button===1||e.button===0&&!e.target.closest(".node")))return;
  e.preventDefault();stopGlide();pan={b:e.button,x:e.clientX,y:e.clientY,px,py};vp.classList.add("panning")});
window.addEventListener("mousemove",e=>{if(!pan)return;if(!(e.buttons&(pan.b===1?4:1))){pan=null;vp.classList.remove("panning");return}
  px=pan.px+e.clientX-pan.x;py=pan.py+e.clientY-pan.y;applyView()});
window.addEventListener("mouseup",e=>{if(pan&&e.button===pan.b){pan=null;vp.classList.remove("panning")}});
vp.addEventListener("auxclick",e=>{if(e.button===1)e.preventDefault()});
/* panel width: drag the grip or use arrow keys. It lives outside #panel, so polling re-renders cannot drop the pointer capture. The panel stays on the physical right, also in RTL */
const grip=$("#panelGrip"),PANEL_KEY="grill.panelWidth",PANEL_MIN=320;
let gripDrag=null,panelW=0; /* panelW: width the user set in this page; a saved width that is only capped by the window stays untouched until then */
function syncGrip(){const p=$("#panel");grip.setAttribute("aria-valuemin",PANEL_MIN);grip.setAttribute("aria-valuemax",Math.max(PANEL_MIN,innerWidth-120));if(!p.hidden)grip.setAttribute("aria-valuenow",p.offsetWidth)}
function setPanelWidth(w){const p=$("#panel"),n=Math.round(Math.min(Math.max(PANEL_MIN,innerWidth-120),Math.max(PANEL_MIN,w)));if(n===p.offsetWidth)return;panelW=n;document.documentElement.style.setProperty("--panel-w",n+"px");syncGrip();p.querySelectorAll("#fMsg,#fAns,#fQuestion,#fIdea,#fIdeaEdit,#fPreview").forEach(fit)}
function savePanelWidth(){if(!panelW)return;try{localStorage.setItem(PANEL_KEY,panelW)}catch{}}
try{const w=Number(localStorage.getItem(PANEL_KEY));if(Number.isFinite(w)&&w>=PANEL_MIN)document.documentElement.style.setProperty("--panel-w",Math.round(w)+"px")}catch{} /* not clamped to this window: the CSS cap restores the full width once the window grows */
const endGrip=()=>{if(!gripDrag)return;gripDrag=null;grip.classList.remove("drag");savePanelWidth()};
grip.addEventListener("pointerdown",e=>{if(e.button!==0||e.ctrlKey)return;e.preventDefault();grip.setPointerCapture(e.pointerId);gripDrag={off:$("#panel").offsetWidth-(innerWidth-e.clientX)};grip.classList.add("drag")}); /* preventDefault keeps focus in the input being typed in */
grip.addEventListener("pointermove",e=>{if(!gripDrag)return;if($("#panel").hidden||!(e.buttons&1)){endGrip();if(grip.hasPointerCapture(e.pointerId))grip.releasePointerCapture(e.pointerId);return}setPanelWidth(innerWidth-e.clientX+gripDrag.off)}); /* the panel can close mid-drag (Escape, deleted node), and a native menu can swallow the button release */
grip.addEventListener("lostpointercapture",endGrip); /* fires after pointerup and pointercancel alike */
grip.addEventListener("keydown",e=>{const d=e.key==="ArrowLeft"?16:e.key==="ArrowRight"?-16:0;if(!d)return;e.preventDefault();setPanelWidth($("#panel").offsetWidth+d);savePanelWidth()});
window.addEventListener("resize",syncGrip);

render();poll(true);setInterval(()=>poll(false),1200);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
</script>
</body>
